<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToneGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo-mark">⛨</div>
      <h1 class="popup-title">ToneGuard</h1>
    </header>
    <p class="popup-subtitle">Emotion-aware feed filter</p>

    <div id="progress-section" class="progress-section">
      <div class="progress-status" id="progress-status">Initializing model...</div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <div class="progress-percent" id="progress-percent">0%</div>
    </div>

    <div id="ready-section" class="ready-section" style="display: none;">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span class="status-text">Active</span>
      </div>
      <p class="placeholder-text">Settings coming in a future update.</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
